[s/$title/s]

<div class="card">

    <div class="card-header font_weight500">
        Mis reservas
    </div>

    <div class="card-body">

        <form id="form_filter_reservations_client">

            <div class="row">

                <div class="col-md-3 mb-3">

                    <label for="referenceFilter"
                           class="form-label colorTertiary font_weight500">
                        Referencia
                    </label>

                    <input type="text"
                           id="referenceFilter"
                           name="referenceFilter"
                           class="form-control"
                           placeholder="Referencia">

                </div>


                <div class="col-md-3 mb-3">

                    <label for="facilityFilter"
                           class="form-label colorTertiary font_weight500">
                        Instalación
                    </label>

                    <select id="facilityFilter"
                            name="facilityFilter"
                            class="form-control">

                        <option value="">
                            Todas
                        </option>

                        [s/foreach from=$facilities item=facility/s]

                            <option value="[s/$facility->id/s]">
                                [s/$facility->name|escape/s]
                            </option>

                        [s//foreach/s]

                    </select>

                </div>


                <div class="col-md-3 mb-3">

                    <label for="statusFilter"
                           class="form-label colorTertiary font_weight500">
                        Estado
                    </label>

                    <select id="statusFilter"
                            name="statusFilter"
                            class="form-control">

                        <option value="">
                            Todos
                        </option>

                        [s/foreach from=$reservation_statuses item=status/s]

                            <option value="[s/$status->id/s]">
                                [s/$status->name|escape/s]
                            </option>

                        [s//foreach/s]

                    </select>

                </div>


                <div class="col-md-3 mb-3">

                    <label for="paymentMethodFilter"
                           class="form-label colorTertiary font_weight500">
                        Forma de pago
                    </label>

                    <select id="paymentMethodFilter"
                            name="paymentMethodFilter"
                            class="form-control">

                        <option value="">
                            Todas
                        </option>

                        <option value="BONUS">
                            Bono
                        </option>

                        [s/foreach from=$payment_methods item=payment_method/s]

                            <option value="[s/$payment_method->id/s]">
                                [s/$payment_method->name|escape/s]
                            </option>

                        [s//foreach/s]

                    </select>

                </div>

            </div>


            <div class="row">

                <div class="col-md-3 mb-3">

                    <label for="dateFromFilter"
                           class="form-label colorTertiary font_weight500">
                        Fecha desde
                    </label>

                    <input type="date"
                           id="dateFromFilter"
                           name="dateFromFilter"
                           class="form-control">

                </div>


                <div class="col-md-3 mb-3">

                    <label for="dateUntilFilter"
                           class="form-label colorTertiary font_weight500">
                        Fecha hasta
                    </label>

                    <input type="date"
                           id="dateUntilFilter"
                           name="dateUntilFilter"
                           class="form-control">

                </div>


                <div class="col-md-6 mb-3 d-flex align-items-end justify-content-end">

                    <button type="button"
                            class="btn backgroundMuted colorWhite me-2"
                            onclick="clearFilterReservasCliente();">

                        <i class="fa-solid fa-eraser me-1"></i>
                        Limpiar

                    </button>

                    <button type="button"
                            id="btn_filter_reservations_client"
                            class="btn backgroundPrimary colorWhite"
                            onclick="filterReservasCliente();">

                        <i class="fa-solid fa-magnifying-glass me-1"></i>
                        Buscar

                    </button>

                </div>

            </div>

        </form>

    </div>

</div>


<div id="loading_reservations_client"
     class="loading-div mt-3"
     style="display:none;">

    <img src="[s/$extraUrl/s]assets/images/loading.svg"
         alt="Loading">

    <span>
        Buscando reservas
    </span>

</div>


<div id="reservations_client_results" class="mt-4">

    [s/include file='panel/cliente/tables/tableReservationsClient.html'/s]

</div>
