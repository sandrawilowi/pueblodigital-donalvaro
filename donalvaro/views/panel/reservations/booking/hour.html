<div class="card">

    <div class="card-header font_weight500">
        Fecha y hora
    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-4 mb-3">

                <label for="reservation_date"
                       class="form-label colorTertiary font_weight500">
                    Fecha
                    <span class="text-danger">*</span>
                </label>

                <input type="date"
                       id="reservation_date"
                       name="reservation_date"
                       class="form-control">

            </div>

            <div class="col-md-4 mb-3">

                <label for="reservation_hour"
                       class="form-label colorTertiary font_weight500">
                    Hora
                    <span class="text-danger">*</span>
                </label>

                <input type="time"
                       id="reservation_hour"
                       name="reservation_hour"
                       class="form-control">

            </div>
            
            <div class="col-md-4 mb-3">

                <label for="reservation_duration" class="form-label colorTertiary font_weight500">
                    Duración
                    <span class="text-danger">*</span>
                </label>

                <select id="reservation_duration"
                        name="reservation_duration"
                        class="form-control">

                    <option value="">Seleccione una duración</option>

                    [s/foreach from=$durations item=duration/s]

                    <option value="[s/$duration.minutes/s]">
                        [s/$duration.label/s]
                    </option>

                    [s//foreach/s]

                </select>

                <div class="small colorMuted mt-1">
                    La duración máxima de la reserva es de 4 horas.
                </div>

            </div>

        </div>

    </div>

</div>
