<div class="card">

    <div class="card-header font_weight500">
        Fechas de la reserva
    </div>

    <div class="card-body">

        <div class="row">

            <div class="col-md-6 mb-3">

                <label for="start_at"
                       class="form-label colorTertiary font_weight500">
                    Fecha de entrada
                    <span class="text-danger">*</span>
                </label>

                <input type="date"
                       id="start_at"
                       name="start_at"
                       class="form-control">

            </div>

            <div class="col-md-6 mb-3">

                <label for="end_at"
                       class="form-label colorTertiary font_weight500">
                    Fecha de salida
                    <span class="text-danger">*</span>
                </label>

                <input type="date"
                       id="end_at"
                       name="end_at"
                       class="form-control">

            </div>

        </div>

    </div>

</div>
