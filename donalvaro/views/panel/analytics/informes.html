[s/$title/s]

<div id="buscador">

    <div class="card">

        <div class="card-header font_weight500 d-flex justify-content-between align-items-center">

            <span class="font_weight500">
                Generar informe
            </span>

            <i id="iconCollapseFilterReports"
               class="fa-solid fa-square-minus cursor_pointer ms-auto"
               onclick="toggleFilter('collapseFilterReports', this)"
               aria-label="Mostrar/Ocultar filtros">
            </i>

        </div>

        <div id="collapseFilterReports" class="collapse show">

            <div class="card-body">

                <form id="filterReports" name="filterReports">

                    <div class="row">

                        <div class="col-md-3 mt-2">

                            <label class="colorBase7 font_weight500" for="report_type">
                                Tipo de informe
                            </label>

                            <div class="custom-select">

                                <select class="form-control"
                                        id="report_type"
                                        name="report_type">

                                    <option value="RESERVATIONS">
                                        Reservas
                                    </option>

                                    <option value="INCOME">
                                        Ingresos
                                    </option>

                                    <option value="ACCESSES">
                                        Accesos
                                    </option>

                                    <option value="CLIENTS">
                                        Clientes
                                    </option>

                                    <option value="ORIGIN">
                                        Procedencia de clientes
                                    </option>

                                    [s/if $bonuses_enabled/s]
                                    <option value="BONUSES">Bonos</option>
                                    [s//if/s]

                                </select>

                            </div>

                        </div>


                        <div class="col-md-3 mt-2">

                            <label class="colorBase7 font_weight500" for="report_date_from">
                                Desde
                            </label>

                            <div>
                                <input type="date"
                                       class="form-control"
                                       id="report_date_from"
                                       name="report_date_from">
                            </div>

                        </div>


                        <div class="col-md-3 mt-2">

                            <label class="colorBase7 font_weight500" for="report_date_until">
                                Hasta
                            </label>

                            <div>
                                <input type="date"
                                       class="form-control"
                                       id="report_date_until"
                                       name="report_date_until">
                            </div>

                        </div>


                        <div class="col-md-3 mt-2">

                            <label class="colorBase7 font_weight500" for="report_facility_id">
                                Instalación
                            </label>

                            <div class="custom-select">

                                <select class="form-control"
                                        id="report_facility_id"
                                        name="report_facility_id">

                                    <option value="">
                                        Todas
                                    </option>

                                    [s/foreach from=$facilities item=facility/s]

                                        <option value="[s/$facility->id/s]">
                                            [s/$facility->name/s]
                                        </option>

                                    [s//foreach/s]

                                </select>

                            </div>

                        </div>

                    </div>


                    <div id="report_reservation_filters">

                        <div class="row">

                            <div class="col-md-3 mt-3">

                                <label class="colorBase7 font_weight500" for="report_status_id">
                                    Estado
                                </label>

                                <div class="custom-select">

                                    <select class="form-control"
                                            id="report_status_id"
                                            name="report_status_id">

                                        <option value="">
                                            Todos
                                        </option>

                                        [s/foreach from=$reservation_statuses item=status/s]

                                            <option value="[s/$status->id/s]">
                                                [s/$status->name/s]
                                            </option>

                                        [s//foreach/s]

                                    </select>

                                </div>

                            </div>

                        </div>

                    </div>

                </form>


                <div id="report_error"
                     class="alert alert-danger mt-3"
                     style="display:none;">
                </div>


                <div class="row mt-4">

                    <div class="col-md-6">

                        <button type="button"
                                class="btn btn-primary px-4"
                                id="btnGenerateReport"
                                onclick="generateReport();">

                            Generar informe

                        </button>

                    </div>


                    <div class="col-md-6 text-end">

                        <button type="button"
                                aria-label="Limpiar"
                                class="btn btn-clear"
                                onclick="clearReportFilters();">

                            <i class="fa-regular fa-trash-can"></i>

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<div id="loading_report"
     class="loading-div"
     style="display:none;">

    <img alt="Loading" src="assets/images/loading.svg">

    <div class="text-center colorMuted">
        Generando informe
    </div>

</div>


<div id="report_results" class="mt-3"></div>
