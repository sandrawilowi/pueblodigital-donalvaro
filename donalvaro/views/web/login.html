<main class="login-page">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="login-card">
                    <div class="text-center mb-4">

                        <div class="feature-icon mx-auto">
                            <i class="fa-solid fa-right-to-bracket"></i>
                        </div>

                        <h1 class="fw-bold mb-2">
                            Iniciar sesión
                        </h1>

                        <p class="text-muted mb-0">
                            Acceda a su cuenta para gestionar reservas y consultar la información disponible.
                        </p>

                    </div>

                    <form id="login-form" name="login-form">

                        <div class="mb-3">

                            <label class="form-label">
                                Correo electrónico
                            </label>

                            <input
                                aria-label="Email"
                                type="email"
                                name="email"
                                class="form-control"
                                autocomplete="username"
                                autofocus>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                Contraseña
                            </label>

                            <div class="password-wrapper">

                                <input
                                    id="password"
                                    type="password"
                                    name="password"
                                    class="form-control"
                                    autocomplete="current-password"
                                    aria-label="Contraseña">

                                <button
                                    type="button"
                                    class="btn-password"
                                    aria-label="Mostrar contraseña"
                                    onclick="togglePassword('password','password-icon');">                                    
                                    <i id="password-icon" class="fa-regular fa-eye"></i>

                                </button>

                            </div>

                        </div>

                        <div id="resultLogin" class="mb-3 text-danger">

                        </div>

                        <button
                            id="btnLogin"
                            class="btn btn-primary btn-lg w-100 rounded-pill" onclick="doLogin();">

                            <i class="fa-solid fa-right-to-bracket me-2"></i>

                            Entrar

                        </button>

                    </form>

                    <div class="text-center mt-4">

                        <div class="mb-2">

                            <a href="/forgot-password"
                               class="text-decoration-none">

                                ¿Ha olvidado su contraseña?

                            </a>

                        </div>

                        <div class="text-muted">

                            ¿No dispone de cuenta?

                        </div>

                        <a href="register"
                           class="fw-semibold text-decoration-none">

                            Crear una cuenta

                        </a>

                    </div>

                    <div class="text-center text-muted small mt-4">
                        Acceso reservado a usuarios autorizados.
                    </div>
                </div>

                <div class="text-center text-muted mt-4">
                    Don Álvaro Digital<br>
                    Plataforma de control de accesos municipales
                </div>
            </div>
        </div>
    </div>
</main>
